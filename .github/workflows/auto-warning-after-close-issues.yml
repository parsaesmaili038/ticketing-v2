name: Issue Security Warning

on:
  issues:
    types:
      - closed

permissions:
  issues: write

jobs:
  security-warning:
    name: Warn Before Security Lock
    runs-on: ubuntu-latest

    steps:
      - name: Check who closed the Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const closer = context.payload.sender;

            // Pull Requests are excluded.
            if (issue.pull_request) {
              return;
            }

            // Continue only when the original Issue creator
            // is the person who closed the Issue.
            if (!issue.user || !closer) {
              return;
            }

            if (issue.user.login !== closer.login) {
              return;
            }

            const message = [
              "⚠️ **WARNING — AUTOMATIC ISSUE SECURITY PROCESS SCHEDULED**",
              "",
              `Hello @${closer.login},`,
              "",
              "This is an **automatically generated warning** from the project's Issue Security Bot.",
              "",
              "You have closed an Issue that you originally created.",
              "",
              "By closing this Issue, the project assumes that you consider the reported matter resolved, completed, or no longer requiring further discussion.",
              "",
              "If the reported problem has not been resolved, or if you have any additional information that requires the attention of the development team, please contact the project's developers or maintainers within the next **24 hours**.",
              "",
              "🔒 **An automatic security process has now been scheduled for this Issue.**",
              "",
              "After the 24-hour period, the project's `Issue Security Lock` workflow will automatically process this Issue according to the project's Issue management policy.",
              "",
              "If you reopen this Issue during this period, please be aware that **reopening it does not cancel the automated security process**.",
              "",
              "The automated workflow may close the Issue again and, when the applicable conditions are met, lock it automatically.",
              "",
              "Once the Issue is locked, further discussion or new comments will no longer be permitted.",
              "",
              "If there is still an unresolved problem, please provide the relevant information to the project's developers or maintainers within the 24-hour period so that it can be reviewed appropriately.",
              "",
              "If the problem remains unresolved after the Issue has been locked, please open a new Issue containing the latest information, relevant details, and any necessary context.",
              "",
              "⚠️ **Important:** This warning is generated automatically. Closing or reopening the Issue does not disable the project's automated Issue security policy.",
              "",
              "Thank you for your understanding and cooperation.",
              "",
              "— Issue Security Bot"
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: message
            });
