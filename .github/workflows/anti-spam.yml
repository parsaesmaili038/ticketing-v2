name: 🛡️ Anti-Spam Protection

run-name: >-
  🛡️ Anti-Spam • Issues #${{ inputs.from_issue }} → #${{ inputs.to_issue }}

on:
  workflow_dispatch:
    inputs:

      # ================================================================
      # 🎯 ISSUE SELECTION
      # ================================================================

      from_issue:
        description: "🎯 [ISSUE RANGE] Start Issue number"
        required: true
        type: number

      to_issue:
        description: "🎯 [ISSUE RANGE] End Issue number"
        required: true
        type: number

      exclude_issues:
        description: "🚫 [ISSUE RANGE] Exclude Issues (e.g. 123,127,140)"
        required: false
        type: string
        default: ""

      # ================================================================
      # 🕒 TIME RANGE
      # ================================================================

      from:
        description: "🕒 [TIME RANGE] Start date/time in UTC (e.g. 2026-09-04T10:00:00Z)"
        required: true
        type: string

      to:
        description: "🕒 [TIME RANGE] End date/time in UTC (e.g. 2026-09-04T12:00:00Z)"
        required: true
        type: string

      # ================================================================
      # 👥 USER FILTER
      # ================================================================

      exclude_users:
        description: "👥 [USER FILTER] Exclude users (e.g. the-par3a,github-actions[bot])"
        required: false
        type: string
        default: "github-actions[bot]"

      threshold:
        description: "🚨 [SPAM DETECTION] Minimum comments from one user"
        required: true
        type: number
        default: 5

      # ================================================================
      # 💬 MESSAGE
      # ================================================================

      message:
        description: "💬 [MESSAGE] Custom warning message — leave empty for default"
        required: false
        type: string
        default: ""

      # ================================================================
      # ⚙️ ACTIONS
      # ================================================================

      lock_issues:
        description: "🔒 [ACTION] Lock affected Issues"
        required: true
        type: boolean
        default: true

      send_message:
        description: "💬 [ACTION] Post warning message before locking"
        required: true
        type: boolean
        default: true

      delete_comments:
        description: "🗑️ [ACTION] Delete detected spam comments"
        required: true
        type: boolean
        default: false

      # ================================================================
      # 🧪 SAFETY
      # ================================================================

      dry_run:
        description: "🧪 [SAFETY] Preview only — make NO changes"
        required: true
        type: boolean
        default: false


permissions:
  contents: read
  issues: write


jobs:

  anti-spam:

    name: 🛡️ Detect and handle suspicious activity

    runs-on: ubuntu-latest

    steps:

      # ================================================================
      # 🛡️ HEADER
      # ================================================================

      - name: 🛡️ Anti-Spam Protection
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║                 🛡️ ANTI-SPAM PROTECTION                 ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  Repository : ${{ github.repository }}"
          echo "║  Started by : ${{ github.actor }}"
          echo "║  Run ID     : ${{ github.run_id }}"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""

      # ================================================================
      # 🔍 VALIDATE CONFIGURATION
      # ================================================================

      - name: 🔍 Validate configuration
        env:
          FROM_ISSUE: ${{ inputs.from_issue }}
          TO_ISSUE: ${{ inputs.to_issue }}
          FROM_DATE: ${{ inputs.from }}
          TO_DATE: ${{ inputs.to }}
          THRESHOLD: ${{ inputs.threshold }}
        run: |
          echo "🔍 Validating configuration..."
          echo ""

          if [ "$FROM_ISSUE" -gt "$TO_ISSUE" ]; then
            echo "❌ ERROR: Start Issue must be smaller than or equal to End Issue."
            exit 1
          fi

          if [ "$THRESHOLD" -lt 1 ]; then
            echo "❌ ERROR: Threshold must be at least 1."
            exit 1
          fi

          if ! python -c "from datetime import datetime; datetime.fromisoformat('${FROM_DATE//Z/+00:00}')" 2>/dev/null; then
            echo "❌ ERROR: Invalid 'from' date/time."
            echo "   Example: 2026-09-04T10:00:00Z"
            exit 1
          fi

          if ! python -c "from datetime import datetime; datetime.fromisoformat('${TO_DATE//Z/+00:00}')" 2>/dev/null; then
            echo "❌ ERROR: Invalid 'to' date/time."
            echo "   Example: 2026-09-04T12:00:00Z"
            exit 1
          fi

          echo "✅ Configuration is valid."
          echo "🎯 Issue range : #$FROM_ISSUE → #$TO_ISSUE"
          echo "🕒 Time range  : $FROM_DATE → $TO_DATE"
          echo "🚨 Threshold   : $THRESHOLD"
          echo ""

      # ================================================================
      # 🚨 MAIN PROCESSOR
      # ================================================================

      - name: 🚨 Detect and handle spam
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}

          FROM_ISSUE: ${{ inputs.from_issue }}
          TO_ISSUE: ${{ inputs.to_issue }}

          EXCLUDE_ISSUES: ${{ inputs.exclude_issues }}

          FROM_DATE: ${{ inputs.from }}
          TO_DATE: ${{ inputs.to }}

          EXCLUDE_USERS: ${{ inputs.exclude_users }}
          THRESHOLD: ${{ inputs.threshold }}

          CUSTOM_MESSAGE: ${{ inputs.message }}

          LOCK_ISSUES: ${{ inputs.lock_issues }}
          SEND_MESSAGE: ${{ inputs.send_message }}
          DELETE_COMMENTS: ${{ inputs.delete_comments }}

          DRY_RUN: ${{ inputs.dry_run }}

        run: |
          python <<'PY'

          import os
          import requests

          from collections import defaultdict
          from datetime import datetime, timezone


          # ============================================================
          # CONFIGURATION
          # ============================================================

          TOKEN = os.environ["GH_TOKEN"]
          REPOSITORY = os.environ["REPOSITORY"]

          OWNER, REPO = REPOSITORY.split("/", 1)

          FROM_ISSUE = int(os.environ["FROM_ISSUE"])
          TO_ISSUE = int(os.environ["TO_ISSUE"])

          FROM_DATE = os.environ["FROM_DATE"]
          TO_DATE = os.environ["TO_DATE"]

          THRESHOLD = int(os.environ["THRESHOLD"])

          LOCK_ISSUES = (
              os.environ["LOCK_ISSUES"].lower() == "true"
          )

          SEND_MESSAGE = (
              os.environ["SEND_MESSAGE"].lower() == "true"
          )

          DELETE_COMMENTS = (
              os.environ["DELETE_COMMENTS"].lower() == "true"
          )

          DRY_RUN = (
              os.environ["DRY_RUN"].lower() == "true"
          )


          # ============================================================
          # EXCLUDED ISSUES
          # ============================================================

          excluded_issues = set()

          raw_excluded_issues = os.environ.get(
              "EXCLUDE_ISSUES",
              ""
          )

          for item in raw_excluded_issues.split(","):

              item = item.strip()

              if not item:
                  continue

              try:
                  excluded_issues.add(int(item))

              except ValueError:

                  print(
                      f"⚠️ Invalid Issue number ignored: {item}"
                  )


          # ============================================================
          # EXCLUDED USERS
          # ============================================================

          excluded_users = {
              user.strip().lower()
              for user in os.environ.get(
                  "EXCLUDE_USERS",
                  ""
              ).split(",")
              if user.strip()
          }


          # ============================================================
          # DEFAULT MESSAGE
          # ============================================================

          DEFAULT_MESSAGE = """🚨 Suspicious spam activity detected.

          This activity has been detected as potentially being spam.
          
          The affected Issue has been temporarily locked while the activity is reviewed.
          
          We apologize for the inconvenience and appreciate your understanding."""
          
                    custom_message = os.environ.get(
                        "CUSTOM_MESSAGE",
                        ""
                    ).strip()
          
                    MESSAGE = (
                        custom_message
                        if custom_message
                        else DEFAULT_MESSAGE
                    )


          # ============================================================
          # GITHUB API
          # ============================================================

          headers = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          session = requests.Session()
          session.headers.update(headers)


          # ============================================================
          # DATE PARSER
          # ============================================================

          def parse_date(value):

              value = value.strip()

              if value.endswith("Z"):
                  value = value[:-1] + "+00:00"

              date = datetime.fromisoformat(value)

              if date.tzinfo is None:
                  date = date.replace(
                      tzinfo=timezone.utc
                  )

              return date.astimezone(timezone.utc)


          start = parse_date(FROM_DATE)
          end = parse_date(TO_DATE)


          if start >= end:

              raise ValueError(
                  "The 'from' date must be earlier than the 'to' date."
              )


          # ============================================================
          # CONFIGURATION DISPLAY
          # ============================================================

          print("")
          print("╔══════════════════════════════════════════════════════════╗")
          print("║                 📋 EXECUTION CONFIG                     ║")
          print("╠══════════════════════════════════════════════════════════╣")
          print(
              f"║ 🎯 Issues       : #{FROM_ISSUE} → #{TO_ISSUE}"
          )
          print(
              f"║ 🕒 From         : {start.isoformat()}"
          )
          print(
              f"║ 🕒 To           : {end.isoformat()}"
          )
          print(
              f"║ 🚨 Threshold    : {THRESHOLD}"
          )
          print(
              f"║ 👥 Excluded     : "
              f"{', '.join(sorted(excluded_users)) or 'None'}"
          )
          print(
              f"║ 🚫 Issues out   : "
              f"{', '.join('#' + str(x) for x in sorted(excluded_issues)) or 'None'}"
          )
          print(
              f"║ 🔒 Lock         : "
              f"{'ON' if LOCK_ISSUES else 'OFF'}"
          )
          print(
              f"║ 💬 Message      : "
              f"{'ON' if SEND_MESSAGE else 'OFF'}"
          )
          print(
              f"║ 🗑️ Delete       : "
              f"{'ON' if DELETE_COMMENTS else 'OFF'}"
          )
          print(
              f"║ 🧪 Dry Run      : "
              f"{'ON' if DRY_RUN else 'OFF'}"
          )
          print("╚══════════════════════════════════════════════════════════╝")
          print("")


          # ============================================================
          # BUILD ISSUE RANGE
          # ============================================================

          selected_issues = []

          for issue_number in range(
              FROM_ISSUE,
              TO_ISSUE + 1
          ):

              if issue_number in excluded_issues:
                  continue

              selected_issues.append(issue_number)


          print(
              f"🎯 Selected {len(selected_issues)} Issue(s)."
          )
          print("")


          # ============================================================
          # DRY RUN
          # ============================================================

          if DRY_RUN:

              print("╔══════════════════════════════════════════════════════════╗")
              print("║                 🧪 DRY RUN MODE                         ║")
              print("╠══════════════════════════════════════════════════════════╣")
              print("║ No changes will be made to the repository.              ║")
              print("╚══════════════════════════════════════════════════════════╝")
              print("")

              for issue_number in selected_issues:

                  print(
                      f"   🎯 Would inspect Issue #{issue_number}"
                  )

              print("")
              print(
                  "✅ Dry run completed. Nothing was changed."
              )

              exit(0)


          # ============================================================
          # FIND SUSPICIOUS ACTIVITY
          # ============================================================

          suspicious = []


          for issue_number in selected_issues:

              print(
                  f"🔎 Inspecting Issue #{issue_number}..."
              )


              issue_url = (
                  f"https://api.github.com/repos/"
                  f"{OWNER}/{REPO}/issues/"
                  f"{issue_number}"
              )


              response = session.get(issue_url)


              # --------------------------------------------------------
              # Issue does not exist
              # --------------------------------------------------------

              if response.status_code == 404:

                  print(
                      f"   ⚠️ Issue #{issue_number} does not exist."
                  )

                  continue


              response.raise_for_status()

              issue = response.json()


              # --------------------------------------------------------
              # Pull Requests
              # --------------------------------------------------------

              if "pull_request" in issue:

                  print(
                      f"   ↪️ #{issue_number} is a Pull Request."
                  )

                  print(
                      "   ⏭️ Skipping because this workflow targets Issues."
                  )

                  continue


              # --------------------------------------------------------
              # Get comments
              # --------------------------------------------------------

              comments = []

              page = 1


              while True:

                  comments_url = (
                      f"https://api.github.com/repos/"
                      f"{OWNER}/{REPO}/issues/"
                      f"{issue_number}/comments"
                  )


                  response = session.get(
                      comments_url,
                      params={
                          "per_page": 100,
                          "page": page,
                      }
                  )


                  response.raise_for_status()

                  data = response.json()


                  if not data:
                      break


                  comments.extend(data)


                  if len(data) < 100:
                      break


                  page += 1


              # --------------------------------------------------------
              # Group comments by user
              # --------------------------------------------------------

              user_comments = defaultdict(list)


              for comment in comments:

                  created_at = parse_date(
                      comment["created_at"]
                  )


                  if created_at < start:
                      continue


                  if created_at > end:
                      continue


                  username = comment["user"]["login"]


                  if username.lower() in excluded_users:
                      continue


                  user_comments[
                      username
                  ].append(comment)


              # --------------------------------------------------------
              # Detect suspicious users
              # --------------------------------------------------------

              for username, user_comment_list in user_comments.items():

                  count = len(user_comment_list)


                  if count < THRESHOLD:
                      continue


                  suspicious.append({
                      "issue_number": issue_number,
                      "username": username,
                      "comments": user_comment_list,
                      "count": count,
                  })


                  print(
                      f"   🚨 Suspicious activity:"
                      f" @{username} → {count} comments"
                  )


          # ============================================================
          # NOTHING FOUND
          # ============================================================

          if not suspicious:

              print("")
              print("╔══════════════════════════════════════════════════════════╗")
              print("║                    ✅ CLEAN                             ║")
              print("╠══════════════════════════════════════════════════════════╣")
              print("║ No suspicious spam activity was detected.              ║")
              print("╚══════════════════════════════════════════════════════════╝")
              print("")

              exit(0)


          # ============================================================
          # SUSPICIOUS ACTIVITY FOUND
          # ============================================================

          print("")
          print("╔══════════════════════════════════════════════════════════╗")
          print("║              🚨 SUSPICIOUS ACTIVITY                    ║")
          print("╚══════════════════════════════════════════════════════════╝")
          print("")


          for item in suspicious:

              print(
                  f"🚨 Issue #{item['issue_number']} | "
                  f"@{item['username']} | "
                  f"{item['count']} comments"
              )


          # ============================================================
          # HANDLE SUSPICIOUS ISSUES
          # ============================================================

          processed_issues = set()

          locked_count = 0
          message_count = 0
          deleted_count = 0


          for item in suspicious:

              issue_number = item["issue_number"]


              # ========================================================
              # SEND WARNING MESSAGE
              # ========================================================

              if SEND_MESSAGE:

                  warning = (
                      f"{MESSAGE}\n\n"
                      f"---\n"
                      f"🛡️ **Anti-Spam Protection**\n\n"
                      f"Detected activity: "
                      f"`{item['count']}` comments from "
                      f"`@{item['username']}` "
                      f"between `{FROM_DATE}` and `{TO_DATE}`.\n\n"
                      f"This action was performed automatically "
                      f"by GitHub Actions."
                  )


                  comments_url = (
                      f"https://api.github.com/repos/"
                      f"{OWNER}/{REPO}/issues/"
                      f"{issue_number}/comments"
                  )


                  response = session.post(
                      comments_url,
                      json={
                          "body": warning
                      }
                  )


                  response.raise_for_status()

                  message_count += 1


                  print(
                      f"   💬 Warning posted to Issue #{issue_number}"
                  )


              # ========================================================
              # LOCK ISSUE
              # ========================================================

              if LOCK_ISSUES:

                  lock_url = (
                      f"https://api.github.com/repos/"
                      f"{OWNER}/{REPO}/issues/"
                      f"{issue_number}/lock"
                  )


                  response = session.put(
                      lock_url,
                      json={
                          "lock_reason": "spam"
                      }
                  )


                  if response.status_code == 204:

                      locked_count += 1

                      print(
                          f"   🔒 Issue #{issue_number} locked."
                      )


                  elif response.status_code == 422:

                      print(
                          f"   ℹ️ Issue #{issue_number} is already locked."
                      )


                  else:

                      response.raise_for_status()


              processed_issues.add(
                  issue_number
              )


              # ========================================================
              # DELETE DETECTED COMMENTS
              # ========================================================

              if DELETE_COMMENTS:

                  for comment in item["comments"]:

                      comment_id = comment["id"]


                      delete_url = (
                          f"https://api.github.com/repos/"
                          f"{OWNER}/{REPO}/issues/comments/"
                          f"{comment_id}"
                      )


                      response = session.delete(
                          delete_url
                      )


                      if response.status_code == 204:

                          deleted_count += 1

                          print(
                              f"   🗑️ Deleted comment "
                              f"{comment_id} "
                              f"from @{item['username']}"
                          )


                      elif response.status_code == 404:

                          continue


                      else:

                          response.raise_for_status()


          # ============================================================
          # FINAL REPORT
          # ============================================================

          print("")
          print("")
          print("╔══════════════════════════════════════════════════════════╗")
          print("║                    🏁 FINISHED                          ║")
          print("╠══════════════════════════════════════════════════════════╣")
          print(
              f"║ 🎯 Issues selected : {len(selected_issues)}"
          )
          print(
              f"║ 🚨 Issues affected : {len(processed_issues)}"
          )
          print(
              f"║ 🔒 Issues locked   : {locked_count}"
          )
          print(
              f"║ 💬 Messages posted : {message_count}"
          )
          print(
              f"║ 🗑️ Comments deleted: {deleted_count}"
          )
          print("╚══════════════════════════════════════════════════════════╝")
          print("")

          print(
              "🛡️ Anti-Spam Protection completed successfully."
          )

          PY

