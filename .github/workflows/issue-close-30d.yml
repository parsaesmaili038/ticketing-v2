name: Issue Close - 30 Days

on:
  schedule:
    - cron: "37 0 * * *"

  workflow_dispatch:

permissions:
  issues: write

jobs:
  close:
    name: Close Inactive Issues
    runs-on: ubuntu-latest

    steps:
      - name: Check issues
        uses: actions/github-script@v7
        with:
          script: |
            const now = Date.now();
            const thirtyDays = 30 * 24 * 60 * 60 * 1000;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;

              const { data: comments } =
                await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  sort: "created",
                  direction: "desc",
                  per_page: 100
                });

              const realComments = comments.filter(comment => {
                return comment.user?.type !== "Bot";
              });

              let lastActivity;

              if (realComments.length > 0) {
                lastActivity = new Date(
                  realComments[0].created_at
                ).getTime();
              } else {
                lastActivity = new Date(
                  issue.created_at
                ).getTime();
              }

              const inactivity = now - lastActivity;

              if (inactivity < thirtyDays) continue;

             const message = [
              "🔒 **Issue Closed Due to Inactivity**",
              "",
              "Hello!",
              "",
              "This Issue has not received any activity from a human contributor for the past 30 days.",
              "",
              "To keep the Issue tracker organized and focused on active discussions, this Issue has been automatically closed and locked due to prolonged inactivity.",
              "",
              "Please note that closing this Issue does not necessarily mean that the reported problem has been resolved.",
              "",
              "If the problem still persists, you are welcome to open a new Issue with the latest information, relevant details, and any additional context that may help with further investigation.",
              "",
              "🙏 Thank you for your understanding, patience, and contribution to the project."
            ].join("\n");

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: message
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });

              await github.rest.issues.lock({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                lock_reason: "too heated"
              });
            }
