name: Issue Lock - 60 Days

on:
  schedule:
    - cron: "17 1 * * *"

  workflow_dispatch:

permissions:
  issues: write

jobs:
  lock:
    name: Close and Lock Issues After 60 Days
    runs-on: ubuntu-latest

    steps:
      - name: Check issues
        uses: actions/github-script@v7
        with:
          script: |
            const now = Date.now();
            const sixtyDays = 60 * 24 * 60 * 60 * 1000;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;

              const createdAt = new Date(issue.created_at).getTime();
              const age = now - createdAt;

              if (age < sixtyDays) continue;

              const message = [
                "🔒 **Issue Closed and Locked**",
                "",
                "Hello!",
                "",
                "This Issue has been open for 60 days and has now reached the project's maximum Issue lifetime.",
                "",
                "To keep the Issue tracker organized and allow active discussions to remain the primary focus, this Issue has been automatically closed and locked.",
                "",
                "Please note that closing this Issue does not necessarily mean that the reported problem has been resolved.",
                "",
                "If the problem is still relevant, please open a new Issue with the latest information and details so that it can be reviewed separately.",
                "",
                "🙏 Thank you for your understanding, patience, and contribution to the project."
              ].join("\n");

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: message
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });

              await github.rest.issues.lock({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                lock_reason: "resolved"
              });
            }
