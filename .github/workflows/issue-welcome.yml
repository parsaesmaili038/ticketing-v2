name: Issue Welcome

on:
  issues:
    types:
      - opened

permissions:
  issues: write

jobs:
  welcome:
    name: Welcome Issue
    runs-on: ubuntu-latest

    steps:
      - name: Send welcome message
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            const message = [
              "👋 Hello!",
              "",
              "Thank you for taking the time to report a problem or share a suggestion with us.",
              "",
              "Your report has been received and will be reviewed as soon as possible.",
              "If possible, please provide additional details, reproduction steps, and any relevant information in this Issue.",
              "",
              "🙏 Thank you for your patience and cooperation."
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: message
            });
